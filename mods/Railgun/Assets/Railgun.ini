# Installed beside the mod containers in Voyage/Content/Paks/Railgun.ini.
# Re-read on each entry; exit before editing. No package rebuild is required.
# Exact case-sensitive keys. Inline # comments are supported.

# The main gun damage/resource settings. Cheat here!
HitDamage=350
FullChargeEnergyKWh=0.85
FullChargeTimeSeconds=5.5
IdleConsumptionKW=1

# Base level of the BOOM volume. The game's SFX+Master settings are applied on top of it.
ShotVolumePercent=600

# Recoil effect. Set to 0 to disable recoil.
CameraRecoilStrength=0.5 # Deflects aim by 2 degrees at 1 strength.
ShipRecoilStrength=2     # Controls the backward impulse on a physical carrier.

# The turret rotation limits. Be reasonable or you may get UI artefacts.
YawLimitDegrees=80
MinimumPitchDegrees=-30
MaximumPitchDegrees=30
