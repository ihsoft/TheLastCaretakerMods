# Installed beside the mod containers in Voyage/Content/Paks/Railgun.ini.
# Re-read on each entry; exit before editing. No package rebuild is required.
# Exact case-sensitive keys, decimal point, no inline comments.

# The main gun damage/resource settings. Cheat here!
HitDamage=350
FullChargeEnergyKWh=0.85
FullChargeTimeSeconds=5.5
IdleConsumptionKW=1
OfflineDischargeKW=50

# Recoil multipliers: 0 disables the effect; 10 is MAX.
# ShipRecoilStrength controls the backward impulse on a physical carrier.
# CameraRecoilStrength deflects aim by 2 degrees at 1 strength.
CameraRecoilStrength=0.5
ShipRecoilStrength=10

# Mouse speed modifier in the scope mode.
OpticsMousePercent=35

# The turret rotation limits. Be reasonable or you may get UI artefacts.
YawLimitDegrees=80
MinimumPitchDegrees=-30
MaximumPitchDegrees=10
