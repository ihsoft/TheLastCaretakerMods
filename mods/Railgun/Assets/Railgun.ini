# Installed beside the mod containers in Voyage/Content/Paks/Railgun.ini.
# Re-read on each entry; exit before editing. No package rebuild is required.
# Exact case-sensitive keys, decimal point, no inline comments.
OpticsMousePercent=35
YawLimitDegrees=80
MinimumPitchDegrees=-50
MaximumPitchDegrees=10
ShotVolumePercent=600
StatusIconOpacityPercent=50

# Gameplay tuning. Energy is kilojoules; charge time accepts decimals.
HitDamage=200
FullChargeEnergyKJ=500
FullChargeTimeSeconds=2.0

# Target labels use viewport-center anchors. Offsets are screen pixels.
# Opacity is 0..100; font size is 1..200.
TargetNameOffsetX=0
TargetNameOffsetY=330
TargetNameOpacityPercent=70
TargetNameFontSize=20
TargetNameFontPath=/Game/UI/Terminal/Fonts/ShareTech/ShareTechMono-Regular_Font.ShareTechMono-Regular_Font
TargetNameTypeface=Bold

TargetDistanceOffsetX=0
TargetDistanceOffsetY=185
TargetDistanceOpacityPercent=70
TargetDistanceFontSize=25
TargetDistanceFontPath=/Game/UI/Terminal/Fonts/DSEG/DSEG7Classic-Bold_Font.DSEG7Classic-Bold_Font
TargetDistanceTypeface=Bold

# Stock font alternatives (use Typeface=Default):
# /Game/UI/Fonts/NotoSans-Regular_Font.NotoSans-Regular_Font
# /Game/UI/Fonts/NotoSans-Bold_Font.NotoSans-Bold_Font
# /Game/UI/Terminal/Fonts/DSEG/DSEG7Classic-Bold_Font.DSEG7Classic-Bold_Font
# /Game/UI/Terminal/Fonts/FixedSysExcelsior/Fixedsys_Excelsior_3_01_Regular_Font.Fixedsys_Excelsior_3_01_Regular_Font
# /Game/UI/Terminal/Fonts/Flexi_IBM_Fals/Flexi_IBM_VGA_False_Font.Flexi_IBM_VGA_False_Font
# /Game/UI/Terminal/Fonts/ShareTech/ShareTechMono-Regular_Font.ShareTechMono-Regular_Font
