# Smart Outlet. Restart the game after editing this file.
# Aim at a storage socket and press V (Interact 3) to select a mode.
# Only modes with a section below are offered; normal is always available.
# New ports start in normal mode. Each port remembers its selected mode.
#
# Sections: [OwnerBlueprint.OwnerClass_C:Input] or [...:Output], case-sensitive.
# All three settings in each section are required. Percentages refer to storage
# fill (0..100); between thresholds the port keeps its previous enabled state.
# Input requires Enable < Disable; Output requires Enable > Disable.
# GlowMaterialSlot selects the socket material: 0 = rim for these storages,
# -1 = no glow. Green means enabled; red means disabled.

# Make Salt Water Tank research available at Tier 1. Learn it to unlock the
# tank and its ingredients. Setting false does not revoke learned recipes.
UnlockSaltWaterTank = true

# Medium Battery: smart output opens at 80% or more and closes at 20% or less.
[BP_Module_Battery.BP_Module_Battery_C:Output]
EnablePortAtPercent = 80
DisablePortAtPercent = 20
GlowMaterialSlot = 0

# Fresh Water Tank: smart input opens at 20% or less and closes when full (100%).
[BP_Module_fresh_Water_Tank.BP_Module_fresh_Water_Tank_C:Input]
EnablePortAtPercent = 20
DisablePortAtPercent = 100
GlowMaterialSlot = 0

# Salt Water Tank: smart input opens at 20% or less and closes when full (100%).
[BP_Module_Salt_Water_Tank.BP_Module_salt_Water_Tank_C:Input]
EnablePortAtPercent = 20
DisablePortAtPercent = 100
GlowMaterialSlot = 0
