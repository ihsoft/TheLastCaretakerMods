# Smart Outlet. Restart the game after editing this file.

# Number of rules below (0 disables port control; maximum 64).
RuleCount = 3

# Make Salt Water Tank research available at Tier 1. You still need to learn it.
# Setting false does not revoke learned recipes.
UnlockSaltWaterTank = true

# Each RuleN controls one port. Copy a block and increase RuleCount to add one.
# ActorClass: exact storage class path. SocketName: exact port component name.
# Several ports on the same storage can have separate rules; first duplicate wins.
# Mode: "output" sends resources; "input" receives them.
# EnablePortAtPercent / DisablePortAtPercent: storage fill thresholds, 0..100.
# Output enables at or above Enable and disables at or below Disable.
# Input enables at or below Enable and disables at or above Disable.
# Between thresholds, keep the saved state; without saved state, start enabled.
# GlowMaterialSlot: mesh material slot to tint (0 for these ports; -1 disables glow).

# Rule 1.
Rule1ActorClass = "/Game/Blueprints/Modules/Storage/BP_Module_Battery.BP_Module_Battery_C"
Rule1SocketName = "VoyageModuleSocketView2"
Rule1Mode = "output"
Rule1EnablePortAtPercent = 80
Rule1DisablePortAtPercent = 20
Rule1GlowMaterialSlot = 0

# Rule 2.
Rule2ActorClass = "/Game/Blueprints/Modules/Storage/BP_Module_fresh_Water_Tank.BP_Module_fresh_Water_Tank_C"
Rule2SocketName = "VoyageModuleSocketView1"
Rule2Mode = "input"
Rule2EnablePortAtPercent = 20
Rule2DisablePortAtPercent = 80
Rule2GlowMaterialSlot = 0

# Rule 3.
Rule3ActorClass = "/Game/Blueprints/Modules/Storage/BP_Module_Salt_Water_Tank.BP_Module_salt_Water_Tank_C"
Rule3SocketName = "VoyageModuleSocketView1"
Rule3Mode = "input"
Rule3EnablePortAtPercent = 20
Rule3DisablePortAtPercent = 80
Rule3GlowMaterialSlot = 0
