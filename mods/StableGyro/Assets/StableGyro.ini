# Installed beside the mod containers in Voyage/Content/Paks/StableGyro.ini.
# Flight settings are reread when the player enters a Gyro. Inline # comments are supported.
# Mooring port changes require a game restart.

# Defines how fast the pitch changes from 0 to max when W/S are hold. Seconds.
PitchRampSeconds=1.5

# Set false for stock W/S pitch control; the mod-owned X hint is hidden.
EnablePitchCorrection=true

# Set false to leave native altitude and automatic throttle assistance fully in charge.
# Disables all mod-owned Z position/velocity correction and the player-entry HoverPitchScale reset.
EnableAltitudeControl=true

# Set false to disable all mod-owned XY velocity reads, writes, damping, and growth rejection.
# Altitude stabilization and W/S pitch correction remain independent.
EnableHorizontalVelocityControl=true

# Add the second pair of mooring ports and use the four-port Drop Cargo action.
# Set false for the stock plate, stock socket positions, and stock two-port action.
# Restart the game after changing this setting.
EnableFourMooringPorts=true

# Minimum displayed throttle required for altitude stabilization, in percent.
# At or above this threshold, the mod stabilizes altitude when its other conditions are met.
# Below it, the game's normal altitude and automatic throttle controls remain in charge.
AltitudeStabilizationMinimumThrottlePercent=50.0

# AVOID CHANGING SETTINGS BELOW UNLESS YOU KNOW WHAT YOU'RE DOING!
# cm/s^2
AltitudeStabilizationVerticalDeceleration=500.0
# Braking rate after releasing the descend key, in cm/s^2.
AltitudeStabilizationDescentDeceleration=500.0
# cm/s^2
HorizontalVelocityDecayAcceleration=150.0
# Rotor rotation velocity in the stock PropellerVelocity units.
StabilizationMinimumPropellerVelocity=390.0
