<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · Unreal model preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171c22;color:#e8edf3;font:14px system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
header{position:absolute;left:32px;top:26px;pointer-events:none}h1{font-size:25px;font-weight:600;margin:0 0 6px;letter-spacing:.02em}
p{margin:0;color:#9caeba;line-height:1.6}footer{position:absolute;bottom:25px;left:32px;right:32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
nav{display:flex;gap:8px}button{background:#252f3b;color:#dce7f1;border:1px solid #425163;border-radius:8px;padding:10px 15px;font:inherit;cursor:pointer}button:hover,button:focus-visible{background:#35465a;outline:2px solid #89b7d7;outline-offset:2px}
#error{position:absolute;top:40%;left:10%;right:10%;color:#ffd3bd;font-size:18px}
@media(max-width:600px){header{left:18px;top:18px}footer{left:18px;right:18px;font-size:12px}}
</style>
<canvas aria-label="3D model. Drag to orbit. Scroll to zoom." tabindex="0"></canvas>
<header><h1>__TITLE__</h1><p>Saved Unreal project model<br>Neutral material · static preview</p></header>
<footer><p>Drag to orbit · scroll to zoom<br>Arrow keys — orbit · + / − — zoom · R — reset</p><nav aria-label="View"><button id="reset">Reset view</button><button id="side">Side</button><button id="top">Top</button></nav></footer>
<p id="error" role="alert" hidden></p>
<script>
'use strict';
try {
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{antialias:true,alpha:false,preserveDrawingBuffer:true});
if(!gl)throw Error('This preview requires a browser with WebGL support.');
const packed=atob('__GEOMETRY__'),bytes=new Uint8Array(packed.length);for(let i=0;i<packed.length;i++)bytes[i]=packed.charCodeAt(i);
const geometry=new Float32Array(bytes.buffer);
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();
gl.attachShader(prog,shader(gl.VERTEX_SHADER,'attribute vec3 position;attribute vec3 normal;uniform mat4 vp;varying vec3 n;varying vec3 p;void main(){n=normal;p=position;gl_Position=vp*vec4(position,1.);}'));
gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,'precision highp float;varying vec3 n;varying vec3 p;uniform vec3 eye;void main(){vec3 N=normalize(n);if(!gl_FrontFacing)N=-N;vec3 L=normalize(vec3(-.5,1.,.7));vec3 V=normalize(eye-p);float key=max(dot(N,L),0.);float fill=max(dot(N,normalize(vec3(.8,.2,-.5))),0.);float spec=pow(max(dot(N,normalize(L+V)),0.),42.);vec3 c=vec3(.48,.56,.62)*(.25+.65*key+.25*fill)+vec3(.22)*spec;gl_FragColor=vec4(pow(c,vec3(.8)),1.);}'));
gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,geometry,gl.STATIC_DRAW);
for(const [name,offset]of [['position',0],['normal',12]]){const a=gl.getAttribLocation(prog,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,24,offset)}
gl.enable(gl.DEPTH_TEST);gl.clearColor(.09,.11,.135,1);
const uniform=gl.getUniformLocation(prog,'vp'),eyeUniform=gl.getUniformLocation(prog,'eye');
const norm=a=>{const n=Math.hypot(...a);return a.map(v=>v/n)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
function multiply(a,b){const r=new Float32Array(16);for(let c=0;c<4;c++)for(let row=0;row<4;row++)for(let k=0;k<4;k++)r[c*4+row]+=a[k*4+row]*b[c*4+k];return r}
let yaw=.8,pitch=.35,distance=3.8,drag=null;
function draw(){const ratio=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*ratio),h=Math.round(innerHeight*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
const d=distance*Math.max(1,h/w),eye=[d*Math.cos(pitch)*Math.sin(yaw),d*Math.sin(pitch),d*Math.cos(pitch)*Math.cos(yaw)];
const z=norm(eye),x=norm(cross([0,1,0],z)),y=cross(z,x),view=[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1];
const f=1/Math.tan(Math.PI/8),near=.01,far=100,projection=[f/(w/h),0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0];
gl.uniformMatrix4fv(uniform,false,multiply(projection,view));gl.uniform3fv(eyeUniform,eye);gl.drawArrays(gl.TRIANGLES,0,geometry.length/6);}
function reset(){yaw=.8;pitch=.35;distance=3.8;draw()}
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);canvas.focus()});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.008;pitch=Math.max(-1.55,Math.min(1.55,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(1.3,Math.min(12,distance*Math.exp(e.deltaY*.001)));draw()},{passive:false});
canvas.addEventListener('keydown',e=>{let handled=true;switch(e.key){case 'ArrowLeft':yaw-=.12;break;case 'ArrowRight':yaw+=.12;break;case 'ArrowUp':pitch=Math.min(1.55,pitch+.12);break;case 'ArrowDown':pitch=Math.max(-1.55,pitch-.12);break;case '+':case '=':distance=Math.max(1.3,distance*.9);break;case '-':distance=Math.min(12,distance/ .9);break;case 'r':case 'R':reset();break;default:handled=false}if(handled){e.preventDefault();draw()}});
document.querySelector('#reset').onclick=reset;document.querySelector('#side').onclick=()=>{yaw=0;pitch=0;distance=3.8;draw()};document.querySelector('#top').onclick=()=>{yaw=0;pitch=1.55;distance=3.8;draw()};addEventListener('resize',draw);draw();
} catch(e){document.querySelector('#error').hidden=false;document.querySelector('#error').textContent=e.message;console.error(e)}
</script></html>
